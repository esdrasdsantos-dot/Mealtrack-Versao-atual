
name: Versionamento automático

on:
  push:
    branches:
      - test

permissions:
  contents: write

concurrency:
  group: versionamento-test
  cancel-in-progress: false

jobs:
  versionar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar tipo de alteração
        id: versao
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            COMMITS=$(git log -1 --format=%s "$GITHUB_SHA")
          else
            COMMITS=$(git log "$BEFORE..$GITHUB_SHA" --format=%s)
          fi

          echo "$COMMITS"

          if echo "$COMMITS" | grep -Eiq '^(master|feat|fix)(:|\(|[[:space:]])'; then
            if echo "$COMMITS" | grep -Eiq '^master(:|\(|[[:space:]])'; then
              TIPO="MAJOR"
            elif echo "$COMMITS" | grep -Eiq '^feat(:|\(|[[:space:]])'; then
              TIPO="MINOR"
            elif echo "$COMMITS" | grep -Eiq '^fix(:|\(|[[:space:]])'; then
              TIPO="PATCH"
            fi
          else
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(cat Front/mealtrack-frontend/VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$TIPO" in
            MAJOR)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            MINOR)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            PATCH)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Atualizar arquivos de versão
        if: steps.versao.outputs.should_bump == 'true'
        env:
          NEW_VERSION: ${{ steps.versao.outputs.new_version }}
        run: |
          echo "$NEW_VERSION" > Front/mealtrack-frontend/VERSION

          printf 'export const APP_VERSION = "V%s";\n' "$NEW_VERSION" > Front/mealtrack-frontend/src/utils/version.js

      - name: Salvar atualização no Git
        if: steps.versao.outputs.should_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Front/mealtrack-frontend/VERSION Front/mealtrack-frontend/src/utils/version.js

          git commit -m "chore: atualizar versão para V${{ steps.versao.outputs.new_version }}"

          git push origin HEAD:test
