
name: Versionamento automático

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  versionar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Identificar e atualizar versão
        id: bump
        shell: bash
        run: |
          git fetch --tags --force

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            echo "Nenhuma versão inicial encontrada."
            echo "Crie a tag v1.0.0 antes de usar a automação."
            exit 1
          fi

          COMMITS=$(git log "$LAST_TAG..HEAD" --format=%s)

          if [ -z "$COMMITS" ]; then
            echo "Nenhum commit novo para versionar."
            exit 0
          fi

          if echo "$COMMITS" | grep -Eiq '^(master)(:|\(|[[:space:]]|$)'; then
            TYPE="major"
          elif echo "$COMMITS" | grep -Eiq '^(feat)(:|\(|[[:space:]]|$)'; then
            TYPE="minor"
          elif echo "$COMMITS" | grep -Eiq '^(fix)(:|\(|[[:space:]]|$)'; then
            TYPE="patch"
          else
            echo "Nenhum termo de versionamento identificado."
            exit 0
          fi

          VERSION=${LAST_TAG#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "$NEW_VERSION" > VERSION

          printf 'export const APP_VERSION = "V%s";\n' "$NEW_VERSION" \
            > Front/mealtrack-frontend/src/version.js

          git add VERSION Front/mealtrack-frontend/src/version.js

          git commit -m "chore: release $NEW_TAG"

          git tag -a "$NEW_TAG" -m "Release V$NEW_VERSION"

          git push origin HEAD:main
          git push origin "$NEW_TAG"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Publicar Release no GitHub
        if: steps.bump.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
