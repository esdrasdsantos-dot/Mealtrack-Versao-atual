
name: Versionamento - Testes

on:
  push:
    branches:
      - test

permissions:
  contents: write

concurrency:
  group: versionamento-test
  cancel-in-progress: false

jobs:
  versionar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Identificar tipo de alteração
        id: bump
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          VERSION_FILE="Front/mealtrack-frontend/VERSION"
          VERSION_JS="Front/mealtrack-frontend/src/utils/version.js"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Arquivo VERSION não encontrado."
            exit 1
          fi

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git log -1 --format=%s HEAD)
          else
            COMMITS=$(git log "$BEFORE..$GITHUB_SHA" --format=%s)
          fi

          if echo "$COMMITS" | grep -Eiq '^(master)(:|\(|[[:space:]]|$)'; then
            TYPE="major"
          elif echo "$COMMITS" | grep -Eiq '^(feat)(:|\(|[[:space:]]|$)'; then
            TYPE="minor"
          elif echo "$COMMITS" | grep -Eiq '^(fix)(:|\(|[[:space:]]|$)'; then
            TYPE="patch"
          else
            echo "Nenhum termo de versionamento encontrado."
            exit 0
          fi

          VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: $VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "$NEW_VERSION" > "$VERSION_FILE"

          printf 'export const APP_VERSION = "V%s";\n' "$NEW_VERSION" > "$VERSION_JS"

          echo "Versão atualizada: V$NEW_VERSION"

          git add "$VERSION_FILE" "$VERSION_JS"
          git commit -m "chore: atualizar versão para V$NEW_VERSION"

          git push origin HEAD:test
