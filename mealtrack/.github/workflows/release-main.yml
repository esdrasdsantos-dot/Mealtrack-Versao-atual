
name: Release oficial - MealTrack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Criar tag oficial
        id: tag
        shell: bash
        run: |
          VERSION_FILE="Front/mealtrack-frontend/VERSION"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Arquivo VERSION não encontrado."
            exit 1
          fi

          VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"

          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "A tag $TAG já existe. Nenhuma nova Release será criada."
            exit 0
          fi

          git tag -a "$TAG" -m "Release V$VERSION"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Publicar Release
        if: steps.tag.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
